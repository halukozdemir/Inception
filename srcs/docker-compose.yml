services:
  mariadb:
    build: requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    env_file: .env
    networks:
      - inception
    volumes:
      - mariadb_vol:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password

  wordpress:
    build: requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    env_file: .env
    networks:
      - inception
    volumes:
      - wordpress_vol:/var/www/wordpress
    depends_on:
      - mariadb
      - redis
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

  redis:
    build: requirements/redis
    image: redis
    container_name: redis
    restart: always
    networks:
      - inception

  nginx:
    build: requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_vol:/var/www/wordpress
    depends_on:
      - wordpress

  ftp:
    build: requirements/ftp
    image: ftp
    container_name: ftp
    restart: always
    env_file: .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - inception
    volumes:
      - wordpress_vol:/var/www/wordpress
    depends_on:
      - wordpress
    secrets:
      - ftp_password

  static:
    build: requirements/static
    image: static
    container_name: static
    restart: always
    ports:
      - "8080:8080"
    networks:
      - inception

  adminer:
    build: requirements/adminer
    image: adminer
    container_name: adminer
    restart: always
    networks:
      - inception
    depends_on:
      - mariadb

  portainer:
    build: requirements/portainer
    image: portainer
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    networks:
      - inception
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

networks:
  inception:
    driver: bridge

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress
  portainer_data:
    driver: local

secrets:
  db_password:
    file: secrets/db_password.txt
  db_root_password:
    file: secrets/db_root_password.txt
  wp_admin_password:
    file: secrets/wp_admin_password.txt
  wp_user_password:
    file: secrets/wp_user_password.txt
  ftp_password:
    file: secrets/ftp_password.txt
